<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c64d9"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="430" rx="12" fill="#ffffff"/>

  <text x="20" y="30" font-size="15" font-weight="bold" fill="#212529">CLIP</text>
  <text x="62" y="30" font-size="15" fill="#6c757d">&#183;&#160;&#160;two encoders, one shared space for images and texts</text>

  <!-- Image inputs -->
  <g font-size="12" fill="#495057">
    <rect x="20" y="60" width="200" height="56" rx="8" fill="#e8f0fd" stroke="#1c64d9" stroke-width="1.5"/>
    <rect x="32" y="72" width="40" height="32" rx="3" fill="#ffffff" stroke="#1c64d9" stroke-width="1.2"/>
    <circle cx="62" cy="81" r="4" fill="#1c64d9"/>
    <polygon points="34,102 48,86 58,96 64,90 70,102" fill="#1c64d9"/>
    <text x="84" y="85" font-size="13" font-weight="bold" fill="#212529">cat.jpg</text>
    <text x="84" y="102">a photo: pixels</text>

    <rect x="20" y="128" width="200" height="56" rx="8" fill="#e8f0fd" stroke="#1c64d9" stroke-width="1.5"/>
    <rect x="32" y="140" width="40" height="32" rx="3" fill="#ffffff" stroke="#1c64d9" stroke-width="1.2"/>
    <circle cx="62" cy="149" r="4" fill="#1c64d9"/>
    <polygon points="34,170 48,154 58,164 64,158 70,170" fill="#1c64d9"/>
    <text x="84" y="153" font-size="13" font-weight="bold" fill="#212529">server.jpg</text>
    <text x="84" y="170">a photo: pixels</text>
  </g>

  <!-- Text inputs -->
  <g font-size="12" fill="#495057">
    <rect x="20" y="220" width="200" height="56" rx="8" fill="#fff1e8" stroke="#d9480f" stroke-width="1.5"/>
    <text x="34" y="245" font-family="Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#212529">"a photo of a cat"</text>
    <text x="34" y="263">a sentence: words</text>

    <rect x="20" y="288" width="200" height="56" rx="8" fill="#fff1e8" stroke="#d9480f" stroke-width="1.5"/>
    <text x="34" y="313" font-family="Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#212529">"a server room"</text>
    <text x="34" y="331">a sentence: words</text>
  </g>

  <!-- Encoders -->
  <rect x="290" y="60" width="180" height="124" rx="8" fill="#ffffff" stroke="#1c64d9" stroke-width="2"/>
  <text x="380" y="117" font-size="15" font-weight="bold" fill="#1c64d9" text-anchor="middle">Image encoder</text>
  <text x="380" y="137" font-size="12" fill="#495057" text-anchor="middle">a vision transformer</text>

  <rect x="290" y="220" width="180" height="124" rx="8" fill="#ffffff" stroke="#d9480f" stroke-width="2"/>
  <text x="380" y="277" font-size="15" font-weight="bold" fill="#d9480f" text-anchor="middle">Text encoder</text>
  <text x="380" y="297" font-size="12" fill="#495057" text-anchor="middle">a transformer for text</text>

  <g stroke="#1c64d9" stroke-width="2" marker-end="url(#arrow-blue)">
    <line x1="220" y1="88" x2="288" y2="88"/>
    <line x1="220" y1="156" x2="288" y2="156"/>
    <line x1="470" y1="122" x2="548" y2="122"/>
  </g>
  <g stroke="#d9480f" stroke-width="2" marker-end="url(#arrow-orange)">
    <line x1="220" y1="248" x2="288" y2="248"/>
    <line x1="220" y1="316" x2="288" y2="316"/>
    <line x1="470" y1="282" x2="548" y2="282"/>
  </g>

  <!-- Shared space -->
  <rect x="550" y="60" width="430" height="284" rx="8" fill="#f8f9fa" stroke="#212529" stroke-width="1.5"/>
  <text x="566" y="84" font-size="13" font-weight="bold" fill="#212529">Shared space</text>
  <text x="660" y="84" font-size="12" fill="#6c757d">512 numbers per image or text</text>

  <!-- far apart -->
  <line x1="722" y1="196" x2="848" y2="238" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="776" y="236" font-size="12" font-weight="bold" fill="#868e96" text-anchor="end">far apart</text>

  <!-- cat cluster -->
  <ellipse cx="715" cy="156" rx="100" ry="38" fill="none" stroke="#2b8a3e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="715" y="110" font-size="12" font-weight="bold" fill="#2b8a3e" text-anchor="middle">close together</text>
  <circle cx="640" cy="142" r="7" fill="#1c64d9"/>
  <text x="653" y="146" font-size="12" fill="#1c64d9">cat.jpg</text>
  <polygon points="660,162 668,170 660,178 652,170" fill="#d9480f"/>
  <text x="674" y="174" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#d9480f">"a photo of a cat"</text>

  <!-- server cluster -->
  <ellipse cx="862" cy="278" rx="100" ry="38" fill="none" stroke="#2b8a3e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="800" cy="264" r="7" fill="#1c64d9"/>
  <text x="813" y="268" font-size="12" fill="#1c64d9">server.jpg</text>
  <polygon points="818,284 826,292 818,300 810,292" fill="#d9480f"/>
  <text x="832" y="296" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#d9480f">"a server room"</text>

  <!-- legend -->
  <g font-size="12" fill="#495057">
    <circle cx="572" cy="326" r="6" fill="#1c64d9"/>
    <text x="584" y="330">image vector</text>
    <polygon points="672,319 679,326 672,333 665,326" fill="#d9480f"/>
    <text x="686" y="330">text vector</text>
  </g>

  <!-- Notes -->
  <g font-size="12.5" fill="#495057">
    <text x="20" y="385">Zero-shot classification: compare one image vector with one text vector per label; the closest label wins.</text>
    <text x="20" y="405">Search: compare one text vector with every image vector; the closest image wins.</text>
  </g>
</svg>
