<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#212529"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="400" rx="12" fill="#ffffff"/>

  <text x="20" y="30" font-size="15" font-weight="bold" fill="#212529">The agent loop</text>
  <text x="134" y="30" font-size="15" fill="#6c757d">&#183;&#160;&#160;what your code repeats until the model stops asking for tools</text>

  <!-- Question -->
  <rect x="20" y="100" width="180" height="60" rx="8" fill="#fff1e8" stroke="#d9480f" stroke-width="1.5"/>
  <text x="110" y="125" font-size="13" font-weight="bold" fill="#d9480f" text-anchor="middle">Question</text>
  <text x="110" y="144" font-size="12" fill="#495057" text-anchor="middle">+ the tool descriptions</text>

  <line x1="200" y1="130" x2="258" y2="130" stroke="#212529" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LLM -->
  <rect x="260" y="100" width="180" height="60" rx="8" fill="#212529"/>
  <text x="350" y="125" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">LLM</text>
  <text x="350" y="144" font-size="12" fill="#ced4da" text-anchor="middle">chooses the next step</text>

  <line x1="440" y1="130" x2="508" y2="130" stroke="#212529" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision -->
  <polygon points="590,86 670,130 590,174 510,130" fill="#ffffff" stroke="#212529" stroke-width="1.5"/>
  <text x="590" y="135" font-size="13" font-weight="bold" fill="#212529" text-anchor="middle">tool call?</text>

  <!-- no: final answer -->
  <line x1="670" y1="130" x2="778" y2="130" stroke="#212529" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="724" y="121" font-size="12.5" font-weight="bold" fill="#2b8a3e" text-anchor="middle">no</text>

  <rect x="780" y="100" width="200" height="60" rx="8" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/>
  <text x="880" y="125" font-size="13" font-weight="bold" fill="#2b8a3e" text-anchor="middle">Final answer</text>
  <text x="880" y="144" font-size="12" fill="#495057" text-anchor="middle">message.content</text>

  <!-- yes: run the tool -->
  <line x1="590" y1="174" x2="590" y2="238" stroke="#212529" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="602" y="211" font-size="12.5" font-weight="bold" fill="#1c64d9">yes</text>

  <rect x="500" y="240" width="180" height="60" rx="8" fill="#e8f0fd" stroke="#1c64d9" stroke-width="1.5"/>
  <text x="590" y="265" font-size="13" font-weight="bold" fill="#1c64d9" text-anchor="middle">Run the tool</text>
  <text x="590" y="284" font-size="12" fill="#495057" text-anchor="middle">your code, one or more per step</text>

  <line x1="500" y1="270" x2="442" y2="270" stroke="#212529" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Add the result -->
  <rect x="260" y="240" width="180" height="60" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.5"/>
  <text x="350" y="265" font-size="13" font-weight="bold" fill="#7048e8" text-anchor="middle">Add the result</text>
  <text x="350" y="284" font-size="12" fill="#495057" text-anchor="middle">to the messages, role "tool"</text>

  <!-- back to the LLM -->
  <line x1="350" y1="240" x2="350" y2="162" stroke="#212529" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="205" font-size="12.5" fill="#495057" text-anchor="end">back to the LLM</text>

  <!-- Step counter -->
  <rect x="400" y="186" width="140" height="28" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="1.5"/>
  <text x="470" y="205" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">max steps: 5</text>

  <!-- Notes -->
  <g font-size="12.5" fill="#495057">
    <text x="20" y="342">The LLM only chooses. Your code runs the tools, adds the results and calls the model again.</text>
    <text x="20" y="362">The counter is the safety net: after max_steps rounds, run_agent returns "Stopped: too many steps."</text>
  </g>
</svg>
