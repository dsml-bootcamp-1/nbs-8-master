<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 320" width="1060" height="320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c64d9"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="320" rx="12" fill="#ffffff"/>

  <!-- Indexing -->
  <text x="20" y="34" font-size="15" font-weight="bold" fill="#1c64d9">INDEXING</text>
  <text x="132" y="34" font-size="15" fill="#6c757d">&#183;&#160;&#160;once, before any question</text>

  <g font-size="12" fill="#495057" text-anchor="middle">
    <rect x="20" y="48" width="150" height="78" rx="8" fill="#e8f0fd" stroke="#1c64d9" stroke-width="1.5"/>
    <text x="95" y="80" font-size="15" font-weight="bold" fill="#212529">PDF</text>
    <text x="95" y="100">eu_ai_act.pdf</text>

    <rect x="194" y="48" width="150" height="78" rx="8" fill="#e8f0fd" stroke="#1c64d9" stroke-width="1.5"/>
    <text x="269" y="80" font-size="15" font-weight="bold" fill="#212529">Load + clean</text>
    <text x="269" y="100">text of every page</text>

    <rect x="368" y="48" width="150" height="78" rx="8" fill="#e8f0fd" stroke="#1c64d9" stroke-width="1.5"/>
    <text x="443" y="80" font-size="15" font-weight="bold" fill="#212529">Chunks</text>
    <text x="443" y="100">150 words, overlap 30</text>

    <rect x="542" y="48" width="150" height="78" rx="8" fill="#e8f0fd" stroke="#1c64d9" stroke-width="1.5"/>
    <text x="617" y="80" font-size="15" font-weight="bold" fill="#212529">Embeddings</text>
    <text x="617" y="100">384 numbers per chunk</text>

    <path d="M716,58 L716,116 A75,10 0 0 0 866,116 L866,58" fill="#e8f0fd" stroke="#1c64d9" stroke-width="1.5"/>
    <ellipse cx="791" cy="58" rx="75" ry="10" fill="#d3e2fb" stroke="#1c64d9" stroke-width="1.5"/>
    <text x="791" y="90" font-size="15" font-weight="bold" fill="#212529">Vector database</text>
    <text x="791" y="110">Chroma</text>
  </g>

  <g stroke="#1c64d9" stroke-width="2" marker-end="url(#arrow-blue)">
    <line x1="171" y1="87" x2="192" y2="87"/>
    <line x1="345" y1="87" x2="366" y2="87"/>
    <line x1="519" y1="87" x2="540" y2="87"/>
    <line x1="693" y1="87" x2="714" y2="87"/>
  </g>

  <!-- Search: from the database down to the retrieved chunks -->
  <path d="M791,128 L791,166 L443,166 L443,212" fill="none" stroke="#d9480f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-orange)"/>
  <text x="617" y="159" font-size="12" fill="#d9480f" text-anchor="middle">search: the k closest vectors</text>

  <!-- Answering -->
  <text x="20" y="200" font-size="15" font-weight="bold" fill="#d9480f">ANSWERING</text>
  <text x="132" y="200" font-size="15" fill="#6c757d">&#183;&#160;&#160;for every question</text>

  <g font-size="12" fill="#495057" text-anchor="middle">
    <rect x="20" y="214" width="150" height="78" rx="8" fill="#fff1e8" stroke="#d9480f" stroke-width="1.5"/>
    <text x="95" y="244" font-size="15" font-weight="bold" fill="#212529">Question</text>
    <text x="95" y="264">in the user's words</text>

    <rect x="194" y="214" width="150" height="78" rx="8" fill="#fff1e8" stroke="#d9480f" stroke-width="1.5"/>
    <text x="269" y="244" font-size="15" font-weight="bold" fill="#212529">Embedding</text>
    <text x="269" y="264">same model as the chunks</text>

    <rect x="368" y="214" width="150" height="78" rx="8" fill="#fff1e8" stroke="#d9480f" stroke-width="1.5"/>
    <text x="443" y="244" font-size="15" font-weight="bold" fill="#212529">Top-k chunks</text>
    <text x="443" y="264">with section and page</text>

    <rect x="542" y="214" width="150" height="78" rx="8" fill="#fff1e8" stroke="#d9480f" stroke-width="1.5"/>
    <text x="617" y="244" font-size="15" font-weight="bold" fill="#212529">Prompt</text>
    <text x="617" y="264">rules + chunks</text>
    <text x="617" y="280">+ question</text>

    <rect x="716" y="214" width="150" height="78" rx="8" fill="#212529"/>
    <text x="791" y="244" font-size="15" font-weight="bold" fill="#ffffff">LLM</text>
    <text x="791" y="264" fill="#ced4da">gpt-5.4-nano</text>

    <rect x="890" y="214" width="150" height="78" rx="8" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/>
    <text x="965" y="244" font-size="15" font-weight="bold" fill="#212529">Answer</text>
    <text x="965" y="264">with citations</text>
    <text x="965" y="280" font-family="Menlo, Consolas, monospace" fill="#2b8a3e">[chunk-657]</text>
  </g>

  <g stroke="#d9480f" stroke-width="2" marker-end="url(#arrow-orange)">
    <line x1="171" y1="253" x2="192" y2="253"/>
    <line x1="345" y1="253" x2="366" y2="253"/>
    <line x1="519" y1="253" x2="540" y2="253"/>
    <line x1="693" y1="253" x2="714" y2="253"/>
    <line x1="867" y1="253" x2="888" y2="253"/>
  </g>
</svg>
